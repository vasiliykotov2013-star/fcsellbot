name: ForsCraft Realtime 24/7 Cloud Monitor

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: forscraft-bot-worker
  cancel-in-progress: true

jobs:
  realtime-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Git for history auto-saving
        run: |
          git config --global user.name "ForsCraft Bot"
          git config --global user.email "bot@forscraft.net"

      - name: Run Realtime 8-second Polling Worker
        env:
          TELEGRAM_BOT_TOKEN: 8616898795:AAHLdN1ApozJvJuE9vDbIlkGisV0QcFCTWU
          ADMIN_CHAT_ID: 7582896775
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: vasiliykotov2013-star/fcsellbot
        run: python cloud_worker.py
